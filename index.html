<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>伊八寶借閱系統</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44; --ink-soft:#4A5570; --paper:#EDEFE2; --card:#FBFAF4;
  --card-line:#DAD5C2; --marigold:#F59E0B; --marigold-ink:#78350F;
  --teal:#2E7D6B; --teal-ink:#1B4A40; --brick:#C0483B; --brick-ink:#6E2419;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper);
  background-image: linear-gradient(var(--card-line) 1px, transparent 1px); background-size: 100% 32px;
  color:var(--ink); font-family:'Noto Sans TC',sans-serif; -webkit-tap-highlight-color:transparent;
}
.shell{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; padding-bottom:96px; box-shadow:0 0 40px rgba(31,42,68,0.08); }
header.top{ padding:22px 20px 16px; border-bottom:2px solid var(--ink); background:var(--paper); position:sticky; top:0; z-index:20; }
header.top .brand{ font-family:'Fraunces',serif; font-weight:700; font-size:24px; display:flex; align-items:baseline; gap:8px; }
header.top .cloud-note{ margin-top:6px; font-size:11.5px; color:var(--teal-ink); font-weight:600; }
main{padding:18px 20px 8px;}
.tab-section{display:none;} .tab-section.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)}}
.card{ background:var(--card); border:1px solid var(--card-line); border-radius:10px; padding:18px; margin-bottom:14px; }
.card h2{ font-size:18px; font-weight:600; margin:0 0 12px; }
.section-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.08em; color:var(--ink-soft); margin:0 0 6px; }
label.field-label{ display:block; font-size:13.5px; color:var(--ink-soft); margin:10px 0 6px; }
input[type=text], input[type=date], select{ width:100%; padding:12px 14px; border:1.5px solid var(--card-line); border-radius:8px; font-size:16px; background:#fff; }
input:focus, select:focus{outline:2px solid var(--marigold); outline-offset:1px;}
button{font-family:inherit; cursor:pointer;}
.btn{ border:1.5px solid var(--ink); border-radius:8px; padding:13px 16px; font-size:15px; font-weight:600; width:100%; }
.btn-primary{background:var(--ink); color:var(--paper);}

.btn-teal-batch, .btn-marigold-batch {
  padding: 8px 14px !important;
  font-size: 13.5px !important;
  border-radius: 8px !important;
  font-weight: 700 !important;
  white-space: nowrap !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
}
.btn-teal-batch {
  background: var(--teal) !important;
  color: #fff !important;
  border: 1.5px solid var(--teal-ink) !important;
}
.btn-marigold-batch {
  background: #FEF3C7 !important;
  color: #92400E !important;
  border: 2px solid #F59E0B !important;
  box-shadow: 0 2px 4px rgba(245,158,11,0.2);
}

.btn-teal{ background:var(--teal) !important; color:#fff !important; border-color:var(--teal-ink) !important; white-space:nowrap !important; width:auto !important; min-width:68px !important; display:inline-block !important; }
.btn-ghost{background:transparent; border-color:var(--card-line); color:var(--ink-soft); white-space:nowrap;}
.btn-danger{background:var(--brick); color:#fff; border-color:var(--brick-ink);}
.btn-sm{padding:8px 12px !important; font-size:13.5px !important;}
.btn-danger-text{background:none; border:none; color:var(--brick); font-size:13.5px; text-decoration:underline; padding:4px 6px; width:auto;}
.row{display:flex; gap:8px;} .row > *{flex:1;}
.parent-chip, .staff-chip{ border:1.5px solid var(--teal-ink); background:#E4F0EC; color:var(--teal-ink); border-radius:8px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:15px; margin-bottom:8px;}
.opt-list{ border:1.5px solid var(--card-line); border-radius:8px; margin-top:6px; max-height:220px; overflow-y:auto; background:#fff; }
.opt-list .opt{ padding:12px 14px; border-bottom:1px solid var(--card-line); font-size:15px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.code-tag{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--paper); border:1px solid var(--card-line); border-radius:5px; padding:2px 6px; margin-right:6px; }
.type-tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:6px; }
.type-tag.aid{background:#E4F0EC; color:var(--teal-ink);} .type-tag.book{background:#FBEAD3; color:var(--marigold-ink);}
.empty-hint{ text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:14px; }
.record-card{ border:1.5px solid var(--card-line); border-left:5px solid var(--teal); border-radius:8px; padding:14px; margin-bottom:12px; background:#fff; }
.record-card.overdue{border-left-color:var(--brick); background:#FCF1EF;}
.record-card.disinfecting{border-left-color:var(--marigold); background:#FEF3C7;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat-box{background:var(--card); border:1.5px solid var(--card-line); border-radius:9px; padding:14px; cursor:pointer;}
.stat-box:active{transform:scale(0.98);}
.stat-box .num{font-family:'Fraunces',serif; font-size:26px; font-weight:700;}
.stat-box .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px; text-decoration:underline dashed;}
.stat-box.warn{border-color:var(--brick); background:#FCF1EF;} .stat-box.warn .num{color:var(--brick-ink);}
nav.bottom{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:2px solid var(--ink); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); overflow-x:auto; }
nav.bottom button{ flex:1; min-width:68px; background:none; border:none; padding:12px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-soft); font-size:11px; font-weight:600; }
nav.bottom button.active{color:var(--ink);}
.modal-overlay{ position:fixed; inset:0; background:rgba(31,42,68,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
.modal-overlay.hidden{display:none;}
.modal-sheet{ background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:20px; max-height:88vh; overflow-y:auto; }
.modal-sheet h3{ display:flex; justify-content:space-between; align-items:center; margin:0 0 14px; font-size:19px;}
.list-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--card-line); font-size:15px; gap:8px;}
.type-select{display:flex; gap:8px; margin-top:10px;}
.type-select label{ flex:1; text-align:center; border:1.5px solid var(--card-line); border-radius:8px; padding:11px 4px; font-size:14.5px; color:var(--ink-soft); cursor:pointer;}
.type-select input{display:none;}
.type-select label.checked{border-color:var(--teal-ink); background:#E4F0EC; color:var(--teal-ink); font-weight:600;}
.file-btn{ border:1.5px dashed var(--card-line); border-radius:8px; padding:12px; font-size:13.5px; color:var(--ink-soft); text-align:center; display:block; cursor:pointer; margin-top:10px; background:#fff;}
.status-select{ padding:6px 8px; font-size:13px; border-radius:6px; border:1.5px solid var(--card-line); background:var(--paper); max-width:115px; cursor:pointer; font-weight:500;}
.status-select.disinfecting{background:#FEF3C7; border-color:#D97706;}
.status-select.unavailable{background:#FEE2E2; border-color:#DC2626;}
.remark-input{ margin-top:6px; width:100%; padding:6px 8px; font-size:12.5px; border:1px solid var(--card-line); border-radius:5px; background:#fff; color:var(--brick-ink); }
.textarea-box{ width:100%; height:130px; padding:10px; font-size:14px; border:1px solid var(--card-line); border-radius:8px; font-family:inherit; background:#fff; margin-bottom:12px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">伊八寶借閱系統 <small>V9.4</small></div>
  <div class="cloud-note" id="syncStatus">🟢 系統就緒</div>
</header>
<main>
  <section class="tab-section active" data-tab="borrow">
    <div class="card"><p class="section-label">Step 1 · 選擇家長編號</p><div id="parentSelectedWrap"></div></div>
    <div class="card"><p class="section-label">Step 1.5 · 選擇經辦社工</p><div id="staffSelectedWrap"></div></div>
    <div class="card">
      <p class="section-label">Step 2 · 加入教具或繪本</p>
      <input type="text" id="manualCodeInput" placeholder="輸入編號搜尋 (僅比對編號)">
      <div id="manualSuggest" class="opt-list" style="display:none;"></div>
      <div style="height:1px; background:var(--card-line); margin:16px 0;"></div>
      <p class="section-label">目前借閱清單 (教具最多1項, 繪本最多3本)</p>
      <div id="basketList"><div class="empty-hint">尚未加入</div></div>
    </div>
    <div class="card">
      <label class="field-label">借閱日期</label><input type="date" id="borrowDateInput">
      <button class="btn btn-primary" id="btnConfirmBorrow" style="margin-top:16px;">確認借出 (21天後歸還)</button>
    </div>
  </section>

  <section class="tab-section" data-tab="return">
    <div class="card">
      <h2>🏠 家長歸還與續借區</h2>
      <input type="text" id="returnSearch" placeholder="搜尋借出中的編號或家長...">
      <div id="returnList" style="margin-top:10px;"></div>
    </div>
    <div class="card" style="border-color:var(--marigold);">
      <h2>🧼 等待消毒區</h2>
      <div id="disinfectList"></div>
    </div>
  </section>

  <section class="tab-section" data-tab="items">
    <div class="card">
      <h2>新增物品 (單筆建立)</h2>
      <label class="field-label">編號</label><input type="text" id="itemCodeIn">
      <label class="field-label">名稱</label><input type="text" id="itemNameIn">
      <div class="type-select" id="itemTypeSelect">
        <label class="checked" data-type="aid"><input type="radio" name="itemType" value="aid" checked><span>教具</span></label>
        <label data-type="book"><input type="radio" name="itemType" value="book"><span>繪本</span></label>
      </div>
      <button class="btn btn-primary" id="btnAddItem" style="margin-top:14px;">加入清單</button>
      <label class="file-btn">📄 批次匯入 Excel <input type="file" id="itemImportFile" accept=".xlsx" style="display:none;"></label>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="section-label" style="margin:0;">勾選項目批次刪除</span>
        <button class="btn btn-danger btn-sm" onclick="promptDeleteSelectedItems()">🗑️ 刪除勾選教具</button>
      </div>
      <input type="text" id="itemSearch" placeholder="輸入編號搜尋..." style="margin-bottom:10px;">
      <div id="itemList"></div>
    </div>
  </section>

  <section class="tab-section" data-tab="parents">
    <div class="card">
      <h2>新增家長編號</h2>
      <input type="text" id="parentCodeIn" placeholder="例如 P001">
      <button class="btn btn-primary" id="btnAddParent" style="margin-top:14px;">加入名單</button>
      <label class="file-btn">📄 批次匯入 Excel <input type="file" id="parentImportFile" accept=".xlsx" style="display:none;"></label>
    </div>
    <div class="card">
      <input type="text" id="parentSearchMgmt" placeholder="輸入編號搜尋..." style="margin-bottom:10px;">
      <div id="parentMgmtList"></div>
    </div>
  </section>

  <section class="tab-section" data-tab="staff">
    <div class="card">
      <h2>新增社工資料</h2>
      <label class="field-label">社工姓名</label><input type="text" id="staffNameIn" placeholder="例如 王社工">
      <button class="btn btn-primary" id="btnAddStaff" style="margin-top:14px;">加入社工名單</button>
      <label class="file-btn">📄 批次匯入 Excel (僅需姓名欄位) <input type="file" id="staffImportFile" accept=".xlsx" style="display:none;"></label>
    </div>
    <div class="card">
      <input type="text" id="staffSearchMgmt" placeholder="搜尋社工..." style="margin-bottom:10px;">
      <div id="staffMgmtList"></div>
    </div>
  </section>

  <section class="tab-section" data-tab="overview">
    <div class="card" style="margin-bottom:14px;">
      <label class="field-label">選擇檢視年份統計</label>
      <select id="statYearSelect" onchange="renderOverview()"></select>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    
    <div class="card">
      <h2>🏆 年度最夯排行榜</h2>
      <p class="section-label" id="rankTitle">統計中...</p>
      <div id="rankingList"></div>
    </div>

    <div class="card">
      <button class="btn btn-ghost" style="margin-bottom:8px;" onclick="exportItemsExcel()">📥 匯出教具繪本清單 Excel</button>
      <button class="btn btn-ghost" style="margin-bottom:8px;" onclick="exportHistoryExcel()">📥 匯出完整借閱歷史 Excel</button>
      <button class="btn btn-ghost" onclick="exportDeleteExcel()">📥 匯出教具刪除紀錄 Excel</button>
    </div>
  </section>
</main>

<nav class="bottom">
  <button data-tab="borrow" class="active">📦 借閱</button>
  <button data-tab="return">🏠 歸還</button>
  <button data-tab="items">🧸 物品</button>
  <button data-tab="parents">👤 家長</button>
  <button data-tab="staff">👩‍💼 社工</button>
  <button data-tab="overview">📊 總覽</button>
</nav>
</div>

<div class="modal-overlay hidden" id="infoModal">
  <div class="modal-sheet">
    <h3 id="infoModalTitle">標題 <button class="btn-danger-text" onclick="document.getElementById('infoModal').classList.add('hidden')">關閉</button></h3>
    <div id="infoModalBody"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="lineModal">
  <div class="modal-sheet">
    <h3>LINE 通知模板 <button class="btn-danger-text" onclick="document.getElementById('lineModal').classList.add('hidden')">關閉</button></h3>
    <p class="section-label">請複製下方文字傳送給家長：</p>
    <textarea class="textarea-box" id="lineTextContent" readonly></textarea>
    <button class="btn btn-primary" onclick="copyLineText()">📋 一鍵複製訊息</button>
  </div>
</div>

<div class="modal-overlay hidden" id="staffActionModal">
  <div class="modal-sheet">
    <h3 id="staffActionTitle">選擇經辦社工 <button class="btn-danger-text" onclick="document.getElementById('staffActionModal').classList.add('hidden')">關閉</button></h3>
    <p class="section-label" id="staffActionDesc">請選擇本次操作的經辦社工：</p>
    <select id="actionStaffSelect" style="margin-bottom:14px;"></select>
    <button class="btn btn-primary" id="btnConfirmStaffAction">確認執行</button>
  </div>
</div>

<div class="modal-overlay hidden" id="renewModal">
  <div class="modal-sheet">
    <h3>🔄 家長整批續借設定 <button class="btn-danger-text" onclick="document.getElementById('renewModal').classList.add('hidden')">關閉</button></h3>
    <p class="section-label" id="renewInfoDesc" style="color:var(--brick); font-weight:700; font-size:14px; margin-bottom:10px;"></p>
    <label class="field-label">請設定本次續借基準日期 (預設今天)：</label>
    <input type="date" id="renewDateInput" style="margin-bottom:14px;">
    <button class="btn btn-primary" id="btnConfirmRenew">確定整批續借並產生 LINE 訊息</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxD7kfY9co5mA9_rCHsOLzpFXt0GbgXz0KPswKf4rASfk07k__jtbPVSPC2yH2R9JPA8Q/exec"; 

let state = { parents:[], items:[], staff:[], borrows:[], logs:[] };
let basket = []; let selectedParent = null; let selectedStaff = null;
let currentRenewParentCode = null;
let pendingActionType = null; 
let pendingActionData = null; 

async function syncData(action) {
  const local = localStorage.getItem('toy_station_local_v94');
  if(local) { try{ state = JSON.parse(local); }catch(err){} }

  if(!API_URL) return;
  try {
    if(action === 'load') {
      const res = await fetch(API_URL, { cache: 'no-store' });
      const data = await res.json();
      state = {
        parents: data.parents || [],
        items: data.items || [],
        staff: data.staff || [],
        borrows: data.borrows || [],
        logs: data.logs || []
      };
      saveDataLocal();
    } else if (action === 'save') {
      saveDataLocal();
      fetch(API_URL, { 
        method: 'POST', 
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(state) 
      }).catch(err => {});
    }
    document.getElementById('syncStatus').textContent = "🟢 系統就緒 (已連線)";
  } catch(e) {
    document.getElementById('syncStatus').textContent = "🟢 系統就緒 (離線備援模式)";
  }
}

window.onload = async function() {
  await syncData('load');
  initYearSelect();
  renderAll();
  document.getElementById('borrowDateInput').value = new Date().toISOString().slice(0,10);
};

function saveDataLocal() {
  localStorage.setItem('toy_station_local_v94', JSON.stringify(state));
}

function initYearSelect() {
  const sel = document.getElementById('statYearSelect');
  const currentYear = new Date().getFullYear();
  let html = "";
  for(let y = currentYear; y >= currentYear - 3; y--) {
    html += "<option value='" + y + "' " + (y === currentYear ? "selected" : "") + ">" + y + " 年度</option>";
  }
  sel.innerHTML = html;
}

function renderAll() { renderBorrow(); renderReturn(); renderItems(); renderParents(); renderStaff(); renderOverview(); }
function esc(s){return String(s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36); }
function todayISO(){return new Date().toISOString().slice(0,10); }

document.querySelectorAll('nav.bottom button').forEach(function(btn) {
  btn.onclick = function() {
    document.querySelectorAll('nav.bottom button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    document.querySelectorAll('.tab-section').forEach(function(s){s.classList.toggle('active', s.dataset.tab === btn.dataset.tab);});
    renderAll();
  };
});

function getParentSuspensionInfo(parentCode) {
  const today = new Date(todayISO());
  let suspendEndDate = null;
  state.borrows.forEach(function(r) {
    if(r.parentCode === parentCode && r.status === 'returned' && r.returnDate && r.dueDate) {
      const due = new Date(r.dueDate); const ret = new Date(r.returnDate);
      if(ret > due) {
        const overdueDays = Math.floor((ret - due) / 86400000);
        const sameBatchCount = state.borrows.filter(function(x){return x.parentCode === parentCode && x.status === 'returned' && x.returnDate === r.returnDate;}).length;
        const penalty = overdueDays * sameBatchCount;
        let end = new Date(r.returnDate); end.setDate(end.getDate() + penalty);
        if(!suspendEndDate || end > suspendEndDate) suspendEndDate = end;
      }
    }
  });
  state.borrows.forEach(function(r) {
    if(r.parentCode === parentCode && r.status === 'borrowed' && r.dueDate < todayISO()) {
      const due = new Date(r.dueDate); const overdueDays = Math.floor((today - due) / 86400000);
      const activeCount = state.borrows.filter(function(x){return x.parentCode === parentCode && x.status === 'borrowed' && r.dueDate < todayISO();}).length;
      const penalty = overdueDays * activeCount;
      let end = new Date(todayISO()); end.setDate(end.getDate() + penalty);
      if(!suspendEndDate || end > suspendEndDate) suspendEndDate = end;
    }
  });
  if(suspendEndDate && today <= suspendEndDate) {
    const remainDays = Math.ceil((suspendEndDate - today) / 86400000);
    return { isSuspended: true, endDate: suspendEndDate.toISOString().slice(0,10), remainDays: remainDays };
  }
  return { isSuspended: false };
}

function renderBorrow() {
  const wp = document.getElementById('parentSelectedWrap');
  if(selectedParent) {
    const susp = getParentSuspensionInfo(selectedParent.code);
    let tag = susp.isSuspended ? " <span style='color:var(--brick); font-size:13px; font-weight:700;'>(停權至 " + susp.endDate + ")</span>" : "";
    wp.innerHTML = "<div class='parent-chip'><span>👤 家長：" + esc(selectedParent.code) + tag + "</span><span style='font-size:18px; cursor:pointer;' onclick='selectedParent=null; renderBorrow();'>✖</span></div>";
  } else {
    wp.innerHTML = "<input type='text' id='pSearch' placeholder='搜尋家長編號'><div class='opt-list' id='pList'></div>";
    document.getElementById('pSearch').oninput = function(e) {
      const q = e.target.value.toUpperCase();
      const res = state.parents.filter(function(p){return p.code.toUpperCase().includes(q);});
      document.getElementById('pList').innerHTML = res.slice(0,5).map(function(p){
        const susp = getParentSuspensionInfo(p.code);
        let tag = susp.isSuspended ? " <span style='color:var(--brick); font-size:12px;'>(停權中)</span>" : "";
        return "<div class='opt' onclick='selectParentHandler(\"" + p.code + "\")'><span>選擇：" + esc(p.code) + tag + "</span></div>";
      }).join('');
    };
  }

  const swp = document.getElementById('staffSelectedWrap');
  if(selectedStaff) {

document.getElementById('manualCodeInput').oninput = function(e) {
  const q = e.target.value.toUpperCase(); const box = document.getElementById('manualSuggest');
  if(!q) { box.style.display='none'; return; }
  const res = state.items.filter(function(it){return it.code.toUpperCase().includes(q);}).slice(0,5);
  box.style.display = res.length ? 'block' : 'none';
  box.innerHTML = res.map(function(it){
    let st = ''; let op = '1';
    if(it.status === 'borrowed') { st = ' (借出中)'; op = '0.6'; }
    else if(it.status === 'disinfecting') { st = ' (消毒中)'; op = '0.6'; }
    else if(it.status === 'unavailable') { st = ' (不可外借)'; op = '0.6'; }
    return "<div class='opt' style='opacity:" + op + ";' onclick='addBasket(\"" + it.code + "\")'><span><span class='type-tag " + it.type + "'>" + (it.type==='book'?'繪本':'教具') + "</span>" + esc(it.name) + st + "</span><span class='code-tag'>" + esc(it.code) + "</span></div>";
  }).join('');
};

function addBasket(code) {
  if(!selectedParent) return alert('請先選擇家長');
  if(!selectedStaff) return alert('請先選擇經辦社工');
  const susp = getParentSuspensionInfo(selectedParent.code);
  if(susp.isSuspended) return alert("⚠️ 該家長停權中 (至 " + susp.endDate + ")");
  if(basket.find(function(b){return b.code===code;})) return alert('已在清單中');
  
  const itemToAdd = state.items.find(function(i){return i.code===code;});
  if(!itemToAdd) return;
  if(itemToAdd.status !== 'available') return alert("⚠️ 此物品目前狀態為「" + itemToAdd.status + "」，無法借閱！");

  const bAids = state.borrows.filter(function(b){return b.parentCode === selectedParent.code && b.status === 'borrowed' && b.itemType === 'aid';}).length;
  const bBooks = state.borrows.filter(function(b){return b.parentCode === selectedParent.code && b.status === 'borrowed' && b.itemType === 'book';}).length;
  const cAids = basket.filter(function(b){return b.type === 'aid';}).length;
  const cBooks = basket.filter(function(b){return b.type === 'book';}).length;

  if (itemToAdd.type === 'aid' && bAids + cAids >= 1) return alert('⚠️ 教具借閱上限 1 項！');
  if (itemToAdd.type === 'book' && bBooks + cBooks >= 3) return alert('⚠️ 繪本借閱上限 3 本！');

  basket.push(itemToAdd);
  document.getElementById('manualCodeInput').value=''; document.getElementById('manualSuggest').style.display='none';
  renderBorrow();
}

document.getElementById('btnConfirmBorrow').onclick = async function() {
  if(!selectedParent || !selectedStaff || !basket.length) return alert('請完整選擇「家長」、「社工」及「借閱物品」');
  
  let confirmMsg = "【請確認借閱資訊】\n\n👤 家長編號：" + selectedParent.code + "\n👩‍💼 經辦社工：" + selectedStaff.name + " (" + selectedStaff.code + ")\n\n📦 借出清單：\n";
  basket.forEach(function(b, idx) { confirmMsg += " " + (idx + 1) + ". [" + (b.type === 'book' ? '繪本' : '教具') + "] " + b.name + " (" + b.code + ")\n"; });
  confirmMsg += "\n確認無誤請按「確定」，需修改請按「取消」。";

  if(!confirm(confirmMsg)) return;

  const d = document.getElementById('borrowDateInput').value;
  const due = new Date(d); due.setDate(due.getDate()+21);
  const dueStr = due.toISOString().slice(0,10);
  const nowTime = new Date().toLocaleString();
  
  basket.forEach(function(b) {
    b.status = 'borrowed';
    state.borrows.push({
      id: uid(),
      parentCode: selectedParent.code,
      staffCode: selectedStaff.code,
      staffName: selectedStaff.name,
      itemCode: b.code,
      itemName: b.name,
      itemType: b.type,
      borrowDate: d,
      dueDate: dueStr,
      status: 'borrowed',
      renewed: false,
      timestamp: nowTime
    });
  });

  const aidList = basket.filter(function(b){return b.type==='aid';}).map(function(b){return b.name;}).join('、') || '無';
  const bookList = basket.filter(function(b){return b.type==='book';}).map(function(b){return b.name;}).join('、') || '無';
  const lineTemplate = "收到！\n教具：" + aidList + "\n繪本：" + bookList + "\n已完成借閱！\n下次歸還日期為" + dueStr;

  saveDataLocal();
  await syncData('save');

  document.getElementById('lineModal').classList.remove('hidden');

  basket=[]; selectedParent=null; renderAll();
};

function renderReturn() {
  const q = document.getElementById('returnSearch').value.toUpperCase();
  
  // 嚴格過濾狀態為 borrowed 的項目
  const activeBorrows = state.borrows.filter(function(r){
    return r.status === 'borrowed' && (r.parentCode.includes(q) || r.itemCode.toUpperCase().includes(q) || r.itemName.toUpperCase().includes(q));
  });

  let parentMap = {};
  activeBorrows.forEach(function(r) {
    if(!parentMap[r.parentCode]) parentMap[r.parentCode] = [];
    parentMap[r.parentCode].push(r);
  });

  let returnHTML = "";
  const parentCodes = Object.keys(parentMap);

  if(parentCodes.length === 0) {
    returnHTML = "<div class='empty-hint'>無符合的借出紀錄</div>";
  } else {
    parentCodes.forEach(function(pCode) {
      const items = parentMap[pCode];
      const allRenewed = items.every(function(x){ return x.renewed === true; });
      let renewBtnHTML = "";
      if(allRenewed) {
        renewBtnHTML = "<button class='btn btn-ghost btn-sm' disabled style='border-color:var(--card-line); color:var(--ink-soft); opacity:0.6;'>⚠️ 已達上限</button>";
      } else {
        renewBtnHTML = "<button class='btn-marigold-batch' onclick='openParentRenewModal(\"" + pCode + "\")'>🔄 整批續借</button>";
      }

      let returnAllBtnHTML = "<button class='btn-teal-batch' onclick='openParentReturnModal(\"" + pCode + "\")'>🏠 整批歸還</button>";

      let itemsHTML = items.map(function(r) {
        const isOver = r.dueDate < todayISO();
        let dueTag = isOver ? "<span style='color:var(--brick); font-weight:700;'>(已逾期！應還: " + r.dueDate + ")</span>" : "<span style='color:var(--ink-soft);'>(應還: " + r.dueDate + ")</span>";
        return "<div style='display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--card-line); font-size:14px; gap:12px;'>" +
               "<span style='flex:1; min-width:0;'><span class='type-tag " + r.itemType + "'>" + (r.itemType==='book'?'繪本':'教具') + "</span><span class='code-tag'>" + esc(r.itemCode) + "</span>" + esc(r.itemName) + " <span style='font-size:12px; font-family:\"IBM Plex Mono\";'>" + dueTag + "</span></span>" +
               "<button class='btn btn-teal btn-sm' onclick='initReturnProcess(\"" + r.id + "\")'>歸還</button>" +
               "</div>";
      }).join('');

      returnHTML += "<div class='record-card " + (items.some(function(x){return x.dueDate < todayISO();}) ? 'overdue' : '') + "'>" +
                    "<div style='font-weight:700; margin-bottom:8px; font-size:16px; display:flex; justify-content:space-between; align-items:center;'>" +
                    "<span>👤 家長代號：" + esc(pCode) + "</span>" +
                    "<span style='font-size:12px; color:var(--ink-soft);'>共 " + items.length + " 項借閱中</span>" +
                    "</div>" +
                    itemsHTML +
                    "<div style='margin-top:12px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;'>" + returnAllBtnHTML + renewBtnHTML + "</div>" +
                    "</div>";
    });
  }

  document.getElementById('returnList').innerHTML = returnHTML;

  const disinfecting = state.items.filter(function(i){return i.status==='disinfecting';});
  document.getElementById('disinfectList').innerHTML = disinfecting.length ? disinfecting.map(function(i){
    return "<div class='record-card disinfecting'><div><span class='type-tag " + i.type + "'>" + (i.type==='book'?'繪本':'教具') + "</span><span class='code-tag'>" + esc(i.code) + "</span>" + esc(i.name) + "</div><button class='btn btn-teal btn-sm' style='width:100%; margin-top:12px;' onclick='finishDisinfect(\"" + i.code + "\")'>✅ 消毒完成 (上架)</button></div>";
  }).join('') : "<div class='empty-hint'>消毒區目前無物品</div>";
}

document.getElementById('btnConfirmStaffAction').onclick = async function() {
  const staffCode = document.getElementById('actionStaffSelect').value;
  if(!staffCode) return alert('請選擇社工');
  const staffObj = state.staff.find(function(s){return s.code === staffCode;}) || {name: '未知社工', code: 'N/A'};

  document.getElementById('staffActionModal').classList.add('hidden');

  if(pendingActionType === 'return') {
    const borrowId = pendingActionData.borrowId;
    const b = state.borrows.find(function(x){return x.id === borrowId;});
    if(b) { 
      b.status = 'returned'; 
      b.returnDate = todayISO(); 
      b.returnStaffName = staffObj.name; 
      const i = state.items.find(function(x){return x.code === b.itemCode;});
      if(i) i.status = 'disinfecting';
    }

    saveDataLocal(); await syncData('save'); renderAll();
    alert('✅ 單筆歸還成功！經辦社工已記錄為：' + staffObj.name);

  } else if(pendingActionType === 'return_all_parent') {
    const parentCode = pendingActionData.parentCode;
    const parentItems = state.borrows.filter(function(x){
      return x.parentCode === parentCode && x.status === 'borrowed';
    });

    parentItems.forEach(function(b) {
      b.status = 'returned';
      b.returnDate = todayISO();
      b.returnStaffName = staffObj.name;
      const i = state.items.find(function(x){return x.code === b.itemCode;});
      if(i) i.status = 'disinfecting';
    });

    saveDataLocal(); await syncData('save'); renderAll();
    alert('✅ 整批歸還成功！共歸還 ' + parentItems.length + ' 項物品，經辦社工已記錄為：' + staffObj.name);

  } else if(pendingActionType === 'delete_items') {
    const codes = pendingActionData.codes;
    if(!confirm("確定要刪除勾選的 " + codes.length + " 項物品嗎？")) return;

    if(!state.logs) state.logs = [];
    codes.forEach(function(code){
      const it = state.items.find(function(x){return x.code === code;});
      if(it) {
        let cleanName = it.name.replace(/\s*\(經辦社工:.*\)/g, '').trim();
        state.logs.push({
          type: 'delete_item',
          code: it.code,
          name: cleanName,
          staff: staffObj.name,
          time: new Date().toLocaleString()
        });
      }
    });

    state.items = state.items.filter(function(x){return !codes.includes(x.code);});
    basket = basket.filter(function(x){return !codes.includes(x.code);});

    saveDataLocal(); await syncData('save'); renderAll();
    alert('✅ 刪除完成！經辦社工已記錄為：' + staffObj.name);
  }

  pendingActionType = null;
  pendingActionData = null;
}

  if(!state.staff) state.staff = [];
  const q = document.getElementById('staffSearchMgmt').value.toUpperCase();
  document.getElementById('staffMgmtList').innerHTML = state.staff.filter(function(s){return s.name.toUpperCase().includes(q) || s.code.toUpperCase().includes(q);}).map(function(s){
    return "<div class='list-row'><span>👩‍💼 " + esc(s.name) + " (" + esc(s.code) + ")</span><button class='btn-danger-text' onclick='deleteStaff(\"" + esc(s.code) + "\")'>刪除</button></div>";
  }).join('');
}
document.getElementById('staffSearchMgmt').oninput = renderStaff;

window.deleteStaff = async function(code) {
  if(!confirm("確定刪除此社工？")) return;
  state.staff = state.staff.filter(function(s){return s.code !== code;});
  if(selectedStaff && selectedStaff.code === code) selectedStaff = null;
  saveDataLocal(); await syncData('save'); renderAll();
}

function renderOverview() {
  const selectedYear = parseInt(document.getElementById('statYearSelect').value);
  const totalBorrowsYear = state.borrows.filter(function(b){return b.borrowDate && b.borrowDate.startsWith(selectedYear.toString());}).length;
  const overdueActive = state.borrows.filter(function(b){return b.status === 'borrowed' && b.dueDate < todayISO();}).length;

  document.getElementById('statGrid').innerHTML = 
    "<div class='stat-box'><div class='num'>" + state.items.length + "</div><div class='lbl'>物品總數</div></div>" +
    "<div class='stat-box' onclick='showYearlyBorrowModal(" + selectedYear + ")'><div class='num'>" + totalBorrowsYear + "</div><div class='lbl'>" + selectedYear + " 累積借閱人次 (點擊看每月) 📈</div></div>" +
    "<div class='stat-box'><div class='num'>" + state.borrows.filter(function(b){return b.status==='borrowed';}).length + "</div><div class='lbl'>目前借出中</div></div>" +
    "<div class='stat-box " + (overdueActive?'warn':'') + "' onclick='showOverdueModal()'><div class='num'>" + overdueActive + "</div><div class='lbl'>已逾期 (點擊看名單) ⚠️</div></div>";

  document.getElementById('rankTitle').textContent = selectedYear + " 年度最受歡迎排行榜";
  const yearBorrows = state.borrows.filter(function(b){return b.borrowDate && b.borrowDate.startsWith(selectedYear.toString());});
  
  let aidCounts = {}; let bookCounts = {};
  yearBorrows.forEach(function(b){
    if(b.itemType === 'aid') {
      aidCounts[b.itemName] = (aidCounts[b.itemName] || 0) + 1;
    } else if(b.itemType === 'book') {
      bookCounts[b.itemName] = (bookCounts[b.itemName] || 0) + 1;
    }
  });

  const sortedAids = Object.entries(aidCounts).sort(function(a,b){return b[1] - a[1];}).slice(0,3);
  const sortedBooks = Object.entries(bookCounts).sort(function(a,b){return b[1] - a[1];}).slice(0,3);

  let rankHTML = "<div style='font-size:14px; font-weight:600; color:var(--teal-ink); margin-bottom:4px;'>🧸 熱門教具 Top 3</div>";
  if(sortedAids.length === 0) {
    rankHTML += "<div style='font-size:13px; color:var(--ink-soft); margin-bottom:10px;'>尚無借閱紀錄</div>";
  } else {
    rankHTML += sortedAids.map(function(item, idx){
      return "<div class='list-row' style='padding:6px 0; font-size:13.5px;'><span>#" + (idx+1) + " " + esc(item[0]) + "</span><b>" + item[1] + " 次</b></div>";
    }).join('') + "<div style='margin-bottom:10px;'></div>";
  }

  rankHTML += "<div style='font-size:14px; font-weight:600; color:var(--marigold-ink); margin-bottom:4px;'>📚 熱門繪本 Top 3</div>";
  if(sortedBooks.length === 0) {
    rankHTML += "<div style='font-size:13px; color:var(--ink-soft);'>尚無借閱紀錄</div>";
  } else {
    rankHTML += sortedBooks.map(function(item, idx){
      return "<div class='list-row' style='padding:6px 0; font-size:13.5px;'><span>#" + (idx+1) + " " + esc(item[0]) + "</span><b>" + item[1] + " 次</b></div>";
    }).join('');
  }

  document.getElementById('rankingList').innerHTML = rankHTML;
}

function showYearlyBorrowModal(year) {
  const monthCounts = Array(12).fill(0);
  state.borrows.forEach(function(b) {
    if(b.borrowDate && b.borrowDate.startsWith(year.toString())) {
      const m = parseInt(b.borrowDate.split('-')[1]) - 1;
      if(m >= 0 && m < 12) monthCounts[m]++;
    }
  });

  let html = monthCounts.map(function(cnt, idx){ return "<div class='list-row'><span><b>" + (idx+1) + " 月份</b></span> <b>" + cnt + " 人次</b></div>"; }).join('');
  document.getElementById('infoModalTitle').innerHTML = year + " 年度每月借閱人次 <button class='btn-danger-text' onclick='document.getElementById(\"infoModal\").classList.add(\"hidden\")'>關閉</button>";
  document.getElementById('infoModalBody').innerHTML = html;
  document.getElementById('infoModal').classList.remove('hidden');
}

function showOverdueModal() {
  const overdue = state.borrows.filter(function(b){return b.status==='borrowed' && b.dueDate < todayISO();});
  let html = overdue.length ? overdue.map(function(b){
    const days = Math.floor((new Date(todayISO()) - new Date(b.dueDate)) / 86400000);
    return "<div class='record-card overdue'><div style='font-weight:600;'>👤 家長：" + esc(b.parentCode) + "</div><div style='margin-top:4px;'><span class='code-tag'>" + esc(b.itemCode) + "</span>" + esc(b.itemName) + "</div><div style='color:var(--brick); font-size:12px; font-weight:700; margin-top:8px;'>⚠️ 逾期 " + days + " 天 (應還: " + b.dueDate + ")</div></div>";
  }).join('') : "<div class='empty-hint'>目前沒有逾期的借閱</div>";
  
  document.getElementById('infoModalTitle').innerHTML = "逾期名單 <button class='btn-danger-text' onclick='document.getElementById(\"infoModal\").classList.add(\"hidden\")'>關閉</button>";
  document.getElementById('infoModalBody').innerHTML = html;
  document.getElementById('infoModal').classList.remove('hidden');
}

window.exportItemsExcel = function() {
  const data = state.items.map(function(i){ return { "物品編號": i.code, "物品名稱": i.name, "類型": i.type === 'book' ? '繪本' : '教具', "目前狀態": i.status === 'available' ? '正常' : (i.status === 'borrowed' ? '借出中' : (i.status === 'disinfecting' ? '消毒中' : '不可外借')), "手動備註": i.remark || '' }; });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "教具繪本庫存");
  XLSX.writeFile(wb, "伊八寶借閱系統_庫存備份_" + todayISO() + ".xlsx");
}

window.exportHistoryExcel = function() {
  const data = state.borrows.map(function(r){ return { "處理時間": r.timestamp || '--', "經辦社工": (r.staffName||'') + " (" + (r.staffCode||'') + ")", "家長編號": r.parentCode, "物品編號": r.itemCode, "物品名稱": r.itemName, "類型": r.itemType==='book'?'繪本':'教具', "借閱日期": r.borrowDate, "應還日期": r.dueDate, "歸還日期": r.returnDate || '', "歸還經辦社工": r.returnStaffName || '', "狀態": r.status==='borrowed'?'借出中':(r.status==='returned'?'已歸還':'其他') }; });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "借閱歷程");
  XLSX.writeFile(wb, "伊八寶借閱系統_歷史報表_" + todayISO() + ".xlsx");
}

window.exportDeleteExcel = function() {
  const realLogs = (state.logs || []).filter(function(l){ return l.type === 'delete_item'; });
  if(realLogs.length === 0) return alert('目前沒有刪除紀錄');
  const data = realLogs.map(function(l){ 
    return { 
      "刪除時間": l.time, 
      "類型": '教具/繪本刪除', 
      "物品編號": l.code, 
      "物品名稱": l.name,
      "經辦社工": l.staff || '' 
    }; 
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "刪除紀錄");
  XLSX.writeFile(wb, "伊八寶借閱系統_刪除紀錄_" + todayISO() + ".xlsx");
}

document.getElementById('itemImportFile').onchange = function(e){ handleExcel(e, 'items'); };
document.getElementById('parentImportFile').onchange = function(e){ handleExcel(e, 'parents'); };
document.getElementById('staffImportFile').onchange = function(e){ handleStaffExcel(e); };

function handleStaffExcel(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const wb = XLSX.read(ev.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
    if(rows.length < 2) return alert('表格是空的');
    let count = 0;
    for(let i=1; i<rows.length; i++) {
      const name = String(rows[i][0]||'').trim();
      if(name) {
        const autoCode = 'S' + String(state.staff.length + 1).padStart(2, '0');
        if(!state.staff.find(function(s){return s.name === name;})) {
          state.staff.push({code: autoCode, name: name});
          count++;
        }
      }
    }
    saveDataLocal(); await syncData('save'); renderAll(); alert("成功匯入 " + count + " 位社工！"); e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

function handleExcel(e, target) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const wb = XLSX.read(ev.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
    if(rows.length < 2) return alert('表格是空的');
    const headerRow = rows[0];
    const isHeaderBook = String(headerRow[0]||'').includes('繪本') || String(headerRow[1]||'').includes('繪本') || String(headerRow[2]||'').includes('繪本');
    let count = 0;
    for(let i=1; i<rows.length; i++) {
      if(target==='items') {
        const code = String(rows[i][0]||'').trim().toUpperCase();
        const name = String(rows[i][1]||'').trim();
        const col3 = String(rows[i][2]||'').trim();
        let type = 'aid';
        if (isHeaderBook || code.includes('繪本') || name.includes('繪本') || col3.includes('繪本')) type = 'book';
        if(code && name && !state.items.find(function(x){return x.code===code;})) { state.items.push({code: code, name: name, type: type, status: 'available', remark: ''}); count++; }
      } else {
        const code = String(rows[i][0]).trim().toUpperCase();
        if(code && !state.parents.find(function(x){return x.code===code;})) { state.parents.push({code: code}); count++; }
      }
    }
    saveDataLocal(); await syncData('save'); renderAll(); alert("成功匯入 " + count + " 筆資料！"); e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}
</script>
